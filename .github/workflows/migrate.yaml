name: Database migrations

on:
  push:
    branches: [develop, main]
    paths:
      - 'database/**'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/migrate.yaml'
      - 'docker-compose.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'database/**'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/migrate.yaml'
      - 'docker-compose.yml'
  workflow_dispatch:
    inputs:
      base_revision:
        description: 'Existing branch/tag/commit whose migrations must remain unchanged'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    name: Apply migrations and check constraints
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: forms_ci
          POSTGRES_USER: forms_ci
          # Disposable CI service credentials, never a deployed database secret.
          POSTGRES_PASSWORD: forms_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forms_ci -d forms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: forms_ci
      PGUSER: forms_ci
      PGPASSWORD: forms_ci_password
      PGCONNECT_TIMEOUT: '10'
      PGCLIENTENCODING: UTF8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Enforce immutable migration files
        shell: pwsh
        env:
          MANUAL_BASE_REVISION: ${{ inputs.base_revision }}
        run: |
          $event = Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $baseRevision = $event.pull_request.base.sha
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $event.before -notmatch '^0+$') {
            $baseRevision = $event.before
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $baseRevision = $env:MANUAL_BASE_REVISION
          } else {
            # A new branch has no before commit. Preserve the default branch's
            # existing migrations when it exists; bootstrap an initial repo otherwise.
            $defaultRef = "refs/remotes/origin/$($event.repository.default_branch)"
            git show-ref --verify --quiet $defaultRef
            if ($LASTEXITCODE -eq 0 -and $env:GITHUB_REF_NAME -ne $event.repository.default_branch) {
              $baseRevision = git merge-base HEAD $defaultRef
              if ($LASTEXITCODE -ne 0) { throw 'Cannot determine new-branch baseline.' }
            } else {
              $baseRevision = git hash-object -w -t tree /dev/null
              if ($LASTEXITCODE -ne 0) { throw 'Cannot create initial-repository baseline.' }
            }
          }
          ./database/check-migration-files.ps1 -BaseRevision $baseRevision

      - name: Test migration file policy
        shell: pwsh
        run: ./database/test-migration-files.ps1

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql --version

      - name: Apply migrations to fresh database
        shell: pwsh
        run: ./database/migrate.ps1 -ConnectionMode Psql

      - name: Verify migration replay is safe
        shell: pwsh
        run: ./database/migrate.ps1 -ConnectionMode Psql

      - name: Run database constraint tests
        shell: pwsh
        run: ./database/test.ps1 -ConnectionMode Psql

      - name: Verify missing migration history is rejected
        shell: pwsh
        run: ./database/test-migration-history.ps1 -ConnectionMode Psql

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Typecheck API and database tests
        run: npm run typecheck --workspace @forms/api

      - name: Test API database transactions and readiness
        run: npm run test:db

      - name: Test seed fixtures and rollback safety
        run: npm run test:seed

      - name: Test authentication and owner isolation
        run: npm run test:auth

      - name: Test browser API network failure handling
        run: npm run test:network --workspace @forms/web

      - name: Test draft lifecycle and owner isolation
        run: npm run test:forms

      - name: Test publication transactions and public visibility
        run: npm run test:publication

      - name: Test public submissions and lifecycle races
        run: npm run test:responses

      - name: Test owner response history and access boundaries
        run: npm run test:owned-responses

      - name: Test versioned XLSX export and owner boundaries
        run: npm run test:export

      - name: Seed assessment fixtures and verify safe replay
        # Submission tests use a separate schema and leave these fixtures intact.
        run: |
          npm run seed
          npm run seed
